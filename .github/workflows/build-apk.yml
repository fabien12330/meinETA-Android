name: Build meinETA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate Android project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/fr/fabien/meineta
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "meinETA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'fr.fabien.meineta'
              compileSdk 35

              defaultConfig {
                  applicationId "fr.fabien.meineta"
                  minSdk 24
                  targetSdk 35
                  versionCode 4
                  versionName "1.3"
              }
          }

          dependencies {
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="meinETA"
                  android:theme="@style/Theme.MeinETA">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.MeinETA"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#34393D</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/fr/fabien/meineta/MainActivity.java <<'EOF'
          package fr.fabien.meineta;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final String START_URL =
                      "https://www.meineta.at/registered/boilers/boiler.xhtml?id=63365";

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  CookieManager cookies =
                          CookieManager.getInstance();

                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(
                          webView,
                          true
                  );

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);

                  settings.setUseWideViewPort(true);

                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  applyOrientationMode();

                  webView.setWebChromeClient(
                          new WebChromeClient()
                  );

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return handleUri(
                                          request.getUrl()
                                  );
                              }

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      String url) {

                                  return handleUri(
                                          Uri.parse(url)
                                  );
                              }

                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  CookieManager
                                          .getInstance()
                                          .flush();

                                  applyOrientationMode();

                                  super.onPageFinished(
                                          view,
                                          url
                                  );
                              }

                              private boolean handleUri(
                                      Uri uri) {

                                  String scheme =
                                          uri.getScheme();

                                  if ("http".equalsIgnoreCase(scheme)
                                          ||
                                      "https".equalsIgnoreCase(scheme)) {

                                      return false;
                                  }

                                  try {

                                      startActivity(
                                              new Intent(
                                                      Intent.ACTION_VIEW,
                                                      uri
                                              )
                                      );

                                  } catch (Exception ignored) {
                                  }

                                  return true;
                              }
                          }
                  );

                  if (savedInstanceState == null) {

                      webView.loadUrl(
                              START_URL
                      );

                  } else {

                      webView.restoreState(
                              savedInstanceState
                      );
                  }
              }

              @Override
              public void onConfigurationChanged(
                      Configuration newConfig) {

                  super.onConfigurationChanged(
                          newConfig
                  );

                  applyOrientationMode();
              }

              private void applyOrientationMode() {

                  boolean landscape =
                          getResources()
                                  .getConfiguration()
                                  .orientation
                          == Configuration.ORIENTATION_LANDSCAPE;

                  WebSettings settings =
                          webView.getSettings();

                  if (landscape) {

                      /*
                       * MODE PAYSAGE
                       * Optimisé pour l'interface ETA
                       */

                      settings.setLoadWithOverviewMode(true);

                      webView.setInitialScale(0);

                      getWindow().setFlags(
                              WindowManager.LayoutParams.FLAG_FULLSCREEN,
                              WindowManager.LayoutParams.FLAG_FULLSCREEN
                      );

                      getWindow()
                              .getDecorView()
                              .setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_FULLSCREEN
                                      |
                                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      |
                                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      |
                                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      |
                                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      |
                                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              );

                  } else {

                      /*
                       * MODE PORTRAIT
                       * Comportement identique à la v1.0
                       */

                      settings.setLoadWithOverviewMode(true);

                      webView.setInitialScale(0);

                      getWindow().clearFlags(
                              WindowManager.LayoutParams.FLAG_FULLSCREEN
                      );

                      getWindow()
                              .getDecorView()
                              .setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_VISIBLE
                              );
                  }

                  webView.postDelayed(
                          () -> {
                              webView.reload();
                          },
                          150
                  );
              }

              @Override
              protected void onPause() {

                  CookieManager
                          .getInstance()
                          .flush();

                  super.onPause();
              }

              @Override
              protected void onSaveInstanceState(
                      Bundle outState) {

                  webView.saveState(
                          outState
                  );

                  super.onSaveInstanceState(
                          outState
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView != null
                          &&
                      webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk meinETA-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meinETA-v1.3-APK
          path: meinETA-v1.3.apk
